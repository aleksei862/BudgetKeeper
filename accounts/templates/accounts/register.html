{% extends 'accounts/base.html' %}
{% block content %}
<h2>Регистрация</h2>
<form method="post" id="register-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Зарегистрироваться</button>
</form>
<script>
document.getElementById('register-form').addEventListener('submit', function(e) {
    const email = document.querySelector('input[name="email"]').value;
    const pass1 = document.querySelector('input[name="password1"]').value;
    const pass2 = document.querySelector('input[name="password2"]').value;
    if (pass1 !== pass2) { e.preventDefault(); alert('Пароли не совпадают'); }
    if (!email.includes('@')) { e.preventDefault(); alert('Введите корректный email'); }
});
</script>
{% endblock %}
