{% extends 'accounts/base.html' %}
{% block content %}
<div class="form-container">
    <h2 style="margin-bottom: 20px; text-align: center;">Регистрация</h2>
    <form method="post" id="register-form">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <ul class="errorlist">
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn" style="width: 100%;">Зарегистрироваться</button>
    </form>
</div>

<script>
// Простая JS-валидация, которая меняет цвет рамки
document.getElementById('register-form').addEventListener('submit', function(e) {
    const pass1 = document.querySelector('input[name="password1"]').value;
    const pass2 = document.querySelector('input[name="password2"]').value;

    if (pass1 !== pass2) {
        e.preventDefault();
        alert('Пароли не совпадают');
        document.querySelector('input[name="password2"]').classList.add('error');
    }
});
</script>
{% endblock %}
